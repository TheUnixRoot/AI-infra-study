# Sitio de GitHub Pages (Settings > Pages > Deploy from a branch > main / (root))
title: AI Infra Study
description: Learning path de AI Infrastructure con prácticas reproducibles sobre GPU
theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# README.md -> index; enlaces relativos a .md se convierten en URLs del sitio
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-optional-front-matter
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
readme_index:
  enabled: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: false

# Lo que no es contenido del sitio
exclude:
  - Makefile
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - GEMINI.md
  - AGENTS.md
